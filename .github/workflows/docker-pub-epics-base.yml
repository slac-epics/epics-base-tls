name: docker multi-platform epics-base build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - '7.0-secure-pvaccess'

jobs:
  build-epics-base:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout PVXS repo for Dockerfile
        uses: actions/checkout@v4
        with:
          repository: slac-epics/pvxs-tls
          ref: tls
          path: pvxs
          submodules: recursive

      - name: Checkout EPICS base code
        uses: actions/checkout@v4
        with:
          repository: slac-epics/epics-base-tls
          ref: 7.0-secure-pvaccess
          path: epics-base
          submodules: recursive

      - name: Debug directory content
        run: |
          echo "Contents of epics-base:"
          ls -la epics-base/
          echo "Looking for Makefile:"
          find epics-base/ -name Makefile

      - name: Build and push epics-base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: pvxs/example/docker/epics-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DOCKER_REGISTRY=${{ env.REGISTRY }}
            DOCKER_USERNAME=slac-epics
          tags: ${{ env.REGISTRY }}/slac-epics/epics-base:latest
